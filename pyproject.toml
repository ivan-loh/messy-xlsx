[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messy-xlsx"
version = "0.9.0"
description = "A Python library for parsing messy Excel files with intelligent structure detection and formula evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ivan" }
]
keywords = [
    "excel",
    "xlsx",
    "parser",
    "spreadsheet",
    "data-extraction",
    "pandas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastexcel>=0.19.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "numpy>=2.4.0",
]

[project.optional-dependencies]
formulas = [
    "formulas>=1.3.4",
]
xls = [
    "xlrd>=2.0.2",
]
all = [
    "messy-xlsx[formulas,xls]",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.150",
    "pyarrow>=23.0",
    "ruff>=0.15.0",
    "mypy>=1.20",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[project.urls]
Homepage = "https://github.com/ivan-loh/messy-xlsx"
Repository = "https://github.com/ivan-loh/messy-xlsx"
Issues = "https://github.com/ivan-loh/messy-xlsx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/messy_xlsx"]

[tool.hatch.build.targets.sdist]
exclude = [
    "*CONFIDENTIAL*",
    "*DO_NOT_COMMIT*",
    ".venv/",
    ".hypothesis/",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # ruff-specific rules
    "C901",   # mccabe complexity
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RET504", # unnecessary assignment before return (style preference)
    "SIM108", # use ternary operator (can hurt readability)
    "SIM105", # contextlib.suppress — prefer explicit try/except for clarity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "C901"]
# Pre-existing complex functions — refactor incrementally, don't block CI
"src/messy_xlsx/detection/structure_analyzer.py" = ["C901"]
"src/messy_xlsx/normalization/missing_values.py" = ["C901"]
"src/messy_xlsx/normalization/type_coercion.py" = ["C901"]
"src/messy_xlsx/multi_sheet.py" = ["C901"]
"src/messy_xlsx/parsing/csv_handler.py" = ["C901"]
"src/messy_xlsx/parsing/xls_handler.py" = ["C901"]
"src/messy_xlsx/workbook.py" = ["C901"]
"src/messy_xlsx/formulas/engine.py" = ["C901"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "openpyxl.*",
    "fastexcel.*",
    "xlrd.*",
    "formulas.*",
    "xlcalculator.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
strict_markers = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "generated: marks tests that exercise generated messy workbook corpora",
]
